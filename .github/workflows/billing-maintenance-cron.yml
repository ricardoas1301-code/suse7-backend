name: Billing Maintenance Cron

# Contrato PROD (S1.HF.6.9A.13B):
#   POST secrets.S7_PROD_BILLING_PROCESS_PERIOD_EXPIRATIONS_JOB_URL
#   Header X-Job-Secret: secrets.S7_PROD_JOB_SECRET
#   Body opcional: {"limit":50}
#
# REMOVIDO: billing-process-overdues / S7_PROD_BILLING_PROCESS_OVERDUES_JOB_URL
# (dunning legado 3d — não pertence à arquitetura canônica 10d/D11).
# Nota: este workflow NÃO está no default branch (main) hoje; a remoção
# impede reativação acidental do overdues quando o arquivo for promovido.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  run-prod:
    runs-on: ubuntu-latest
    env:
      PERIOD_JOB_URL: ${{ secrets.S7_PROD_BILLING_PROCESS_PERIOD_EXPIRATIONS_JOB_URL }}
      JOB_SECRET: ${{ secrets.S7_PROD_JOB_SECRET }}
    steps:
      - name: Trigger production billing maintenance jobs (no legacy overdues)
        run: |
          set -euo pipefail
          if [ -z "${PERIOD_JOB_URL}" ] || [ -z "${JOB_SECRET}" ]; then
            echo "::error::Missing PROD billing cron secrets (PERIOD URL and/or S7_PROD_JOB_SECRET)"
            exit 1
          fi

          echo "[billing-cron-prod] legacy overdues scheduler DISABLED (S1.HF.6.9A.13B)"

          for job_name in period-expirations; do
            url="${PERIOD_JOB_URL}"
            echo "[billing-cron-prod] firing ${job_name}"
            http_code=$(curl -sS -o "/tmp/billing-${job_name}-prod.json" -w "%{http_code}" -X POST "${url}" \
              -H "Content-Type: application/json" \
              -H "X-Job-Secret: ${JOB_SECRET}" \
              -d '{"limit":50}')
            echo "[billing-cron-prod] ${job_name} http_status=${http_code}"
            if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
              echo "::error::Falha PROD ${job_name}: HTTP ${http_code}"
              exit 1
            fi
          done
